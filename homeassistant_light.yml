blueprint:
  name: Motion Lighting - Day and Night Offsets
  description: >
    Reusable motion lighting automation.

    At night, motion turns the light on at the selected brightness.
    After the configured period without motion, the light dims and then
    turns off.

    During the day, an already-on light turns off after the configured
    period without motion.

    Sunset and sunrise offsets allow the nighttime period to begin before
    sunset, after sunset, before sunrise, or after sunrise.
  domain: automation

  input:
    motion_sensor:
      name: Motion sensor
      description: Motion sensor for this room.
      selector:
        entity:
          domain: binary_sensor
          device_class: motion

    light_target:
      name: Light or light group
      description: Light, light group, or multiple lights to control.
      selector:
        target:
          entity:
            domain: light

    motion_confirm_seconds:
      name: Motion confirmation time
      description: >
        Motion must remain detected for this many seconds before the
        nighttime light turns on.
      default: 20
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: seconds
          mode: box

    night_no_motion_minutes:
      name: Nighttime no-motion timeout
      description: >
        Minutes without motion before the nighttime light dims.
      default: 3
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: minutes
          mode: box

    day_no_motion_minutes:
      name: Daytime no-motion timeout
      description: >
        Minutes without motion before an already-on daytime light turns off.
      default: 15
      selector:
        number:
          min: 1
          max: 240
          step: 1
          unit_of_measurement: minutes
          mode: box

    nighttime_brightness:
      name: Nighttime motion brightness
      description: Brightness when motion is detected during the nighttime period.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    dim_brightness:
      name: Dim brightness
      description: Brightness used before the light turns off at night.
      default: 50
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    fade_seconds:
      name: Fade duration
      description: Duration used when dimming or turning off the light.
      default: 60
      selector:
        number:
          min: 0
          max: 600
          step: 1
          unit_of_measurement: seconds
          mode: box

    sunset_offset:
      name: Sunset offset
      description: >
        Positive values start the nighttime period after sunset.
        Negative values start the nighttime period before sunset.
        Format examples: 00:30:00 or -00:30:00.
      default: "00:00:00"
      selector:
        text:
          type: text

    sunrise_offset:
      name: Sunrise offset
      description: >
        Positive values extend the nighttime period after sunrise.
        Negative values end the nighttime period before sunrise.
        Format examples: 00:30:00 or -00:30:00.
      default: "00:00:00"
      selector:
        text:
          type: text

mode: restart
max_exceeded: silent

triggers:
  # Motion must remain active for the configured period.
  - trigger: state
    entity_id: !input motion_sensor
    from: "off"
    to: "on"
    for:
      seconds: !input motion_confirm_seconds
    id: nighttime_motion

  # Motion must remain clear for the configured daytime period.
  - trigger: state
    entity_id: !input motion_sensor
    from: "on"
    to: "off"
    for:
      minutes: !input day_no_motion_minutes
    id: daytime_no_motion

conditions: []

actions:
  - choose:

      # ---------------------------------------------------------------
      # NIGHTTIME MOTION
      # ---------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: nighttime_motion

          # Nighttime starts at sunset plus sunset_offset
          # and ends at sunrise plus sunrise_offset.
          - condition: sun
            after: sunset
            after_offset: !input sunset_offset
            before: sunrise
            before_offset: !input sunrise_offset

        sequence:
          - action: light.turn_on
            target: !input light_target
            data:
              brightness_pct: !input nighttime_brightness

          # Wait until motion has been clear for the nighttime timeout.
          - wait_for_trigger:
              - trigger: state
                entity_id: !input motion_sensor
                from: "on"
                to: "off"
                for:
                  minutes: !input night_no_motion_minutes

          # Dim the light.
          - action: light.turn_on
            target: !input light_target
            data:
              brightness_pct: !input dim_brightness
              transition: !input fade_seconds

          # Leave the light dim for the configured duration.
          - delay:
              seconds: !input fade_seconds

          # Turn the light off.
          - action: light.turn_off
            target: !input light_target
            data:
              transition: !input fade_seconds

      # ---------------------------------------------------------------
      # DAYTIME NO MOTION
      # ---------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: daytime_no_motion

          # Daytime is the inverse of the configured nighttime period.
          - condition: not
            conditions:
              - condition: sun
                after: sunset
                after_offset: !input sunset_offset
                before: sunrise
                before_offset: !input sunrise_offset

        sequence:
          - action: light.turn_off
            target: !input light_target
            data:
              transition: !input fade_seconds
