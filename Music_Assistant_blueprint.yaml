blueprint:
  name: Scheduled Music Assistant Tracks
  description: Play a list of Music Assistant tracks at a set time, with optional volume control.
  domain: automation

  input:
    player:
      name: Music Assistant player
      selector:
        entity:
          domain: media_player

    tracks:
      name: Tracks to play
      description: Enter one Music Assistant track URI or exact track name per line, in playback order.
      selector:
        text:
          multiline: true

    play_time:
      name: Play time
      selector:
        time:

    set_volume_before_playback:
      name: Set volume before playback
      description: Set the selected player to the chosen volume before playing.
      default: true
      selector:
        boolean:

    volume_level:
      name: Playback volume
      description: Volume from 0.0 (mute) to 1.0 (maximum).
      default: 0.35
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
          mode: slider

variables:
  tracks_text: !input tracks
  set_volume_before_playback: !input set_volume_before_playback

triggers:
  - trigger: time
    at: !input play_time

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ set_volume_before_playback }}"
        sequence:
          - action: media_player.volume_set
            target:
              entity_id: !input player
            data:
              volume_level: !input volume_level

          - delay: "00:00:01"

  - action: music_assistant.play_media
    target:
      entity_id: !input player
    data:
      media_id: "{{ tracks_text.split('\n') | map('trim') | reject('equalto', '') | list }}"
      media_type: track
      enqueue: replace

mode: single
